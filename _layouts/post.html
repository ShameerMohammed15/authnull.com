<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}" class="bg-white">
<head>   
  {% include ga.html %} 
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>AuthNull Blog - {{ page.title }}</title>
  <meta name="description" content="Passwordless Privileged Access Management - {{page.title}}">
    <meta name="keywords" content="Privileged,access,management,PAM,passwordless,passwordless-for-servers">
    <meta name="robots" content="index">
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/cookieconsent.css" | relative_url }}" media="print" onload="this.media='all'">
    <link rel="icon" type="image/png" href="{{ "/assets/images/favicon.png" | relative_url }}" >
    <link rel="canonical" href="https://authnull.com{{page.url}}" />

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=DM+Sans"
  />

  <style></style>
</head>
<body class="antialiased">
  <script defer src="/assets/js/cookieconsent.js"></script>
  <script defer src="/assets/js/cookieconsent-init.js"></script>

  {% include header.html %}
  <!-- Hero -->

  <style type="text/css">
    .blog-text {
      font-size: 17px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue",
        sans-serif;
      font-kerning: normal;
      margin-top: 1.5rem;
      font-weight: 400;
      font-display: block;
    }
  </style>
  <article
    class="max-w-4xl px-6 py-24 mx-auto space-y-12 bg-white text-black"
  >
    <div class="max-w-6xl mx-auto space-y-4 text-center">
       
      <h1 class="text-4xl font-bold leadi md:text-5xl">
        {{page.title }}
      </h1>
      
    </div>
    <div class="text-xl " >
      <p>{{content}}</p>
    </div>
     
      
      </div>
    </div>
  </article>
  {% include postbox.html %} 
  {% include blog_bottom.html %} 
  {% include footer.html %}

  <script src="/preline/dist/preline.js"></script>
</body>
