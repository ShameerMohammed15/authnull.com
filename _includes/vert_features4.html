/* lovely fluid fonts */

:root {
  --fluid-min-width: 320;
  --fluid-max-width: 1140;

  --fluid-screen: 100vw;
  --fluid-bp: calc(
    (var(--fluid-screen) - var(--fluid-min-width) / 16 * 1rem) /
      (var(--fluid-max-width) - var(--fluid-min-width))
  );
}

@media screen and (min-width: 1140px) {
  :root {
    --fluid-screen: calc(var(--fluid-max-width) * 1px);
  }
}

:root {
  --f-0-min: 16;
  --f-0-max: 18;
  --step-0: calc(
    ((var(--f-0-min) / 16) * 1rem) + (var(--f-0-max) - var(--f-0-min)) *
      var(--fluid-bp)
  );

  --f-1-min: 16;
  --f-1-max: 22.5;
  --step-1: calc(
    ((var(--f-1-min) / 16) * 1rem) + (var(--f-1-max) - var(--f-1-min)) *
      var(--fluid-bp)
  );

  --f-2-min: 23.04;
  --f-2-max: 28.13;
  --step-2: calc(
    ((var(--f-2-min) / 16) * 1rem) + (var(--f-2-max) - var(--f-2-min)) *
      var(--fluid-bp)
  );

  --f-3-min: 27.65;
  --f-3-max: 35.16;
  --step-3: calc(
    ((var(--f-3-min) / 16) * 1rem) + (var(--f-3-max) - var(--f-3-min)) *
      var(--fluid-bp)
  );

  --f-4-min: 33.18;
  --f-4-max: 46;
  --step-4: calc(
    ((var(--f-4-min) / 16) * 1rem) + (var(--f-4-max) - var(--f-4-min)) *
      var(--fluid-bp)
  );
}

/* fluid paddings */

:root {
  --fluid-min-width: 320;
  --fluid-max-width: 1140;

  --fluid-screen: 100vw;
  --fluid-bp: calc(
    (var(--fluid-screen) - var(--fluid-min-width) / 16 * 1rem) /

  );
}

@media screen and (min-width: 1140px) {

  }
}

:root {
  --fc-s-min: (var(--f-0-min, 21));
  --fc-s-max: (var(--f-0-max, 24));

  --fc-m-min: (var(--fc-s-min) * 6);
  --fc-m-max: (var(--fc-s-max) * 6);

  --fc-l-min: (var(--fc-s-min) * 8);
  --fc-l-max: (var(--fc-s-max) * 8);

  --fc-xl-min: (var(--fc-s-min) * 10);
  --fc-xl-max: (var(--fc-s-max) * 10);

  /* T-shirt sizes */
  --space-s: calc(
    ((var(--fc-s-min) / 16) * 1rem) + (var(--fc-s-max) - var(--fc-s-min)) *
      var(--fluid-bp)
  );
  --space-m: calc(
    ((var(--fc-m-min) / 16) * 1rem) + (var(--fc-m-max) - var(--fc-m-min)) *
      var(--fluid-bp)
  );
  --space-l: calc(
    ((var(--fc-l-min) / 16) * 1rem) + (var(--fc-l-max) - var(--fc-l-min)) *
      var(--fluid-bp)
  );
  --space-xl: calc(
    ((var(--fc-xl-min) / 16) * 1rem) + (var(--fc-xl-max) - var(--fc-xl-min)) *
      var(--fluid-bp)
  );

  /* One-up pairs */
  --space-s-m: calc(
    ((var(--fc-s-min) / 16) * 1rem) + (var(--fc-m-max) - var(--fc-s-min)) *
      var(--fluid-bp)
  );
  --space-m-l: calc(
    ((var(--fc-m-min) / 16) * 1rem) + (var(--fc-l-max) - var(--fc-m-min)) *
      var(--fluid-bp)
  );
  --space-l-xl: calc(
    ((var(--fc-l-min) / 16) * 1rem) + (var(--fc-xl-max) - var(--fc-l-min)) *
      var(--fluid-bp)
  );
}

/* prism */

pre {
  --ifm-pre-background: var(--ifm-color-gray-800) !important;
  --ifm-font-family-monospace: "Fraktion Mono";
}
/* Plain text style */
code {
  border: none;
  border-radius: 4px;
  padding: 1rem;
  font-weight: bold;
  font-size: 1.2rem;
  vertical-align: baseline;
  background: #28292b;
  color: #f5f4e6de;
}

/* Comment */
code .token.comment {
  color: #9c9c9c;
  font-style: italic;
}

/* String and inserted */
code .token.string,
code .token.inserted {
  color: #63d55a;
}

/* Number */
code .token.number {
  color: rgb(247, 140, 108);
}

/* Builtin, char, constant, and function */
code .token.builtin,
code .token.char,
code .token.constant,
code .token.function {
  color: rgb(130, 170, 255);
}

/* Punctuation and selector */
code .token.punctuation,
code .token.selector {
  color: rgb(199, 146, 234);
}

/* Variable */
code .token.variable {
  color: rgb(191, 199, 213);
}

/* Class-name and attr-name */
code .token.class-name,
code .token.attr-name {
  color: rgb(255, 203, 107);
}

/* Tag and deleted */
code .token.tag,
code .token.deleted {
  color: rgb(255, 85, 114);
}

/* Operator */
code .token.operator {
  color: rgb(137, 221, 255);
}

/* Boolean */
code .token.boolean {
  color: rgb(255, 88, 116);
}

/* Keyword */
code .token.keyword {
  font-style: italic;
}

/* Doctype */
code .token.doctype {
  color: rgb(199, 146, 234);
  font-style: italic;
}

/* Namespace */
code .token.namespace {
  color: rgb(178, 204, 214);
}

/* URL */
code .token.url {
  color: rgb(221, 221, 221);
}

/* Hide elements visually, but not for screenreaders by clipping it */

.vh {
  position: absolute !important;
  clip: rect(1px, 1px, 1px, 1px);
  padding: 0 !important;
  border: 0 !important;
  height: 1px !important;
  width: 1px !important;
  overflow: hidden;
}

.checkbox label {
  display: flex;
  align-items: center;
  flex-direction: row;
  justify-content: center;
}

.checkbox label:before {
  content: "";
  width: 20px;
  height: 20px;
  border-radius: 2px;
  background: var(--light);
  display: inline-block;
  margin-right: 10px;
}

  background: var(--green) no-repeat center;
  background-size: 12px 12px;
}

      <script id="rendered-js" >
"use strict";
const allCheckbox = document.querySelector('#all'), filters = gsap.utils.toArray('.filter'), items = gsap.utils.toArray('.item');
function updateFilters() {
    const state = Flip.getState(items), // get the current state
    classes = filters.filter(checkbox => checkbox.checked).map(checkbox => "." + checkbox.id), matches = classes.length ? gsap.utils.toArray(classes.join(",")) : classes;
    // adjust the display property of each item ("none" for filtered ones, "inline-flex" for matching ones)
    items.forEach(item => item.style.display = matches.indexOf(item) === -1 ? "none" : "inline-flex");
    // animate from the previous state
    Flip.from(state, {
        duration: 0.7,
        scale: true,
        ease: "power1.inOut",
        stagger: 0.08,
        absolute: true,
        onEnter: elements => gsap.fromTo(elements, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 1 }),
        onLeave: elements => gsap.to(elements, { opacity: 0, scale: 0, duration: 1 })
    });
    // Update the all checkbox:
    allCheckbox.checked = matches.length === items.length;
}
filters.forEach(btn => btn.addEventListener('click', updateFilters));
allCheckbox.addEventListener('click', () => {
    filters.forEach(checkbox => checkbox.checked = allCheckbox.checked);
    updateFilters();
});

    </script>
