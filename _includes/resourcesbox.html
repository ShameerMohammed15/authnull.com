<div class="max-w-[85rem] px-4 py-6 sm:px-4 lg:px-8 lg:py-6 mx-auto bg-white relative">
  <!-- Background Image -->
  <div class="absolute inset-0 pointer-events-none"></div>

  <!-- Grid -->
  <div class="relative grid sm:grid-cols-2 lg:grid-cols-3 gap-10 z-10">
    {% assign resources = site.resources | sort: 'date' | reverse %}
    {% for resource in resources %}
    <!-- Card -->
    <a class="  group block rounded-xl overflow-hidden shadow-lg bg-slate-50 hover:shadow-xl hover:bg-white p-6 relative transition-all" href="{{ resource.url }}">
      <!-- Icon and Title -->
      <div class="text-sm">
        <p class="text-gray-500">{{ resource.date | date: "%B %d, %Y" }}</p>
      </div>
      <div class="flex items-center mb-4">
        <h2 class="text-2xl font-bold group-hover:text-blue-800 group-hover:underline transition-colors">
          {{ resource.title }}
        </h2>
      </div>

      <!-- Excerpt -->
      <p class="text-gray-600 group-hover:text-gray-900 text-lg transition-colors">
        {{ resource.excerpt }}
      </p>
      
      <!-- Tags -->
      <div class="mt-3 flex flex-wrap gap-2">
        {% for tag in resource.tags %}
        <span class="bg-gray-200 text-gray-800 text-sm font-medium px-2.5 py-0.5 rounded hover:bg-blue-200 transition-colors">
          {{ tag }}
        </span>
        {% endfor %}
      </div>

      <!-- Author and Date -->
     <!-- <div class="mt-5 flex items-center">
        <img class="h-10 w-10 rounded-full object-cover mr-3" src="{{ resource.author_url }}" alt="{{ resource.author_name }}">
        <div class="text-sm">
          <p class="text-gray-900 font-semibold">{{ resource.author_name }}</p>
        </div>
      </div>-->

      <!-- Button -->
      <div class="mt-5">
        <span class="inline-flex items-center justify-center px-4 py-2 text-lg font-medium text-blue-600 bg-transparent border border-blue-200 rounded-md group-hover:text-white group-hover:bg-blue-600 transition-all">
          View
        </span>
      </div>
    </a>
    {% endfor %}
    <!-- End Card -->
  </div>
  <!-- End Grid -->
</div>
