<main class="bg-blue-50">
    <div class="max-w-[85rem] px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto h-screen">
        <div class="max-w-xl mx-auto">
          <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-800 sm:text-4xl">
              Get A Demo
            </h1>
            <p class="mt-1 text-gray-600">
            Begin your journey to passwordless
            </p>
          </div>
        </div>
      
        <div class="bg-white mt-12 max-w-lg mx-auto">
          <!-- Card -->
          <div class="flex flex-col border xl p-4 sm:p-6 lg:p-8">
            <h2 class="mb-8 text-xl font-semibold text-gray-800">
         How can we contact you?
            </h2>
      
            <form>
              <div class="grid gap-4 lg:gap-6">
                <!-- Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:gap-6">
                  <div>
                    <label for="hs-firstname-contacts-1" class="block text-sm text-gray-700 font-medium">First Name</label>
                    <input type="text" name="hs-firstname-contacts-1" id="hs-firstname-contacts-1" class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200  py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500">
                  </div>
      
                  <div>
                    <label for="hs-lastname-contacts-1" class="block text-sm text-gray-700 font-medium">Last Name</label>
                    <input type="text" name="hs-lastname-contacts-1" id="hs-lastname-contacts-1" class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500 ">
                  </div>
                </div>
                <!-- End Grid -->
      
                <!-- Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:gap-6">
                  <div>
                    <label for="hs-email-contacts-1" class="block text-sm text-gray-700 font-medium">Email</label>
                    <input type="email" name="hs-email-contacts-1" id="hs-email-contacts-1" autocomplete="email" class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500">
                  </div>
      
                  <div>
                    <label for="hs-phone-number-1" class="block text-sm text-gray-700 font-medium ">Phone Number</label>
                    <input type="text" name="hs-phone-number-1" id="hs-phone-number-1" class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500">
                  </div>
                </div>
                <!-- End Grid -->
      
                <div>
                    <label for="hs-lastname-contacts-1" class="block text-sm text-gray-700 font-medium">Organization Name</label>
                    <input type="text" name="hs-lastname-contacts-1" id="hs-lastname-contacts-1" class="appearance-none block w-full bg-gray-200 text-gray-700 border border-gray-200 py-3 px-4 leading-tight focus:outline-none focus:bg-white focus:border-gray-500">
                  </div>
              </div>
              <!-- End Grid -->
      
              <div class="mt-6 grid">
                <button type="submit" class="inline-flex justify-center items-center gap-x-3 text-center bg-slate-900 hover:bg-slate-900 border border-transparent text-sm lg:text-base text-white font-medium  focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2 focus:ring-offset-white transition py-3 px-4 ">Send inquiry</button>
              </div>
      
              <div class="mt-3 text-center">
                <p class="text-sm text-gray-500">
                  We'll get back to you in 1-2 business days.
                </p>
              </div>
            </form>
          </div>
          <!-- End Card -->
        </div>
      
      
      </div>
</main>
