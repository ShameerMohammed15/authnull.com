<div class="box-container">
	<div class="box green" data-speed="0.70">0.25</div>
	<div class="box purple" data-speed="0.60">0.4</div>
	<div class="box orange" data-speed="0.7">0</div>
	<div class="box red" data-speed="0.8">1</div>
	<div class="box blue" data-speed="0.7">0.75</div>
</div>


<style type="text/css">
  /* this pen has external styles in the settings panel */

* {
  box-sizing: border-box;
}

button {
  cursor: pointer;
  padding: 8px 16px;
  margin: 10px 5px;
}

body {
  display: flex;
  position: relative;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 1400vh;
}

.box-container {
  top: 50vh;
  position: relative;
  display: flex;
  justify-content: center;
  flex: 1;
  width: 100%;
  overflow: visible;
}

.box {
  font-size: 28px;
  font-weight: 700;
  background-color: blue;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100px;
  width: 15%;
  margin: 10px;
}

</style>

<script>
  gsap.registerPlugin(ScrollTrigger);

// apply parallax effect to any element with a data-speed attribute
gsap.to("[data-speed]", {
  y: (i, el) => (1 - parseFloat(el.getAttribute("data-speed"))) * ScrollTrigger.maxScroll(window) ,
  ease: "none",
  scrollTrigger: {
    start: 0,
    end: "max",
    invalidateOnRefresh: true,
    scrub: 0
  }
});

</script>
