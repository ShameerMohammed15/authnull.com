<style>
  .a { color: black; }
  .pad { padding: var(--space-m); }
  .text-center { text-align: center; }
  .box, .circle {
    width: 75px;
    height: 75px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--green);
    font-weight: 600;
    color: var(--dark);
    line-height: 1.2;
  }
  .circle { border-radius: 99px; }
  .flex-row { width: 100%; display: flex; align-items: center; justify-content: space-around; }
  .scroll-down {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    text-transform: uppercase;
    font-size: 16px;
  }
  .container {
    margin: 2vw;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
  }
  .item { width: 400px; height: 350px; margin: 5px; }
</style>

<section class="bg-blue-50">
  <div class="mx-auto w-full max-w-7xl px-5 py-16 ">
    <div class="mx-auto max-w-xl bg-blue-200 p-8 border rounded-lg">
      <form id="contact-form" class="max-w-sm mx-auto " onsubmit="handleSubmit(event)">
        <h3 class="text-2xl font-bold md:text-4xl">Get in touch </h3>
        <p class="my-4 text-lg text-black">Fill this form to receive more information, a demo, and a price request.</p>

        <div class="mb-4">
          <label for="name" class="mb-1 font-medium">Your Name</label>
          <input id="name" type="text" class="block w-full border px-4 py-2 text-lg" required />
        </div>

        <div class="mb-4">
          <label for="email" class="mb-1 font-medium">Email Address</label>
          <input id="email" type="email" class="block w-full border px-4 py-2 text-lg" required />
        </div>

        <div class="mb-4">
          <label for="company" class="mb-1 font-medium">Company Name</label>
          <input id="company" type="text" class="block w-full border px-4 py-2 text-lg" required />
        </div>

        <div class="mb-4">
          <label for="phone" class="mb-1 font-medium">Phone Number<br />(Include country code, e.g., +11234567890)</label>
          <input id="phone" type="tel" pattern="^\+\d{1,3}\d{4,14}$" class="block w-full border px-4 py-2 text-lg" placeholder="+11234567890" required />
        </div>

        <div class="mb-4">
          <label for="product" class="mb-1 font-medium">Product</label>
          <select id="product" class="block w-full border px-4 py-2 text-lg" required>
            <option value="secrets">Secrets Management</option>
            <option value="pasm">Privileged Account and Session Management (PASM)</option>
            <option value="passwordless">Passwordless Auth</option>
            <option value="agentless">Agentless MFA</option>
          </select>
        </div>

        <button type="submit" class="w-full bg-black text-white py-3 font-semibold">Get Free Quote</button>
      </form>

      <div id="contact-submit" class="hidden text-center mt-8">
        <h3 class="text-2xl font-bold md:text-3xl">Thanks for getting in touch.</h3>
        <p class="my-4 text-lg">We will revert with more information within the next 24-48 hours.</p>
        <img src="/assets/images/thankyou.avif" alt="Thank you again!" class="mx-auto" />
        <a href="/resources/2024-04-01-active-directory-policy-and-credential-issuance.html" class="text-blue-600 underline">Solution Brief - Active Directory Privileged Access</a>
        <br />
        <a href="resources/2024-04-04-policy-based-authentication.html" class="text-blue-600 underline">Solution Brief - Policy Based Authentication</a>
      </div>
    </div>
  </div>
</section>

<script>
  function handleSubmit(event) {
    event.preventDefault();
    document.getElementById("contact-form").style.display = "none";
    document.getElementById("contact-submit").classList.remove("hidden");
    location.href = "#top";
  }
</script>
