<!-- Card Blog -->
<main class="bg-white">
   

<div class="max-w-[85rem] px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto">
  <!-- Grid -->
  <h1 class="text-center text-3xl font-bold text-gray-800 sm:text-4xl mb-5">
Blogs
   </h1>
 
  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-10 ">
    <!-- Card -->
    {% for post in site.posts %}
    {% assign value = forloop.index | modulo:3 %}
    {% if value != 0 %}
    <a class="group rounded-xl overflow-hidden hover:shadow-lg p-4 md:p-6" href="{{post.url}}">
      <div class="relative pt-[50%] sm:pt-[70%] rounded-xl overflow-hidden">
        <img class="w-full h-full absolute top-0 left-0 object-cover group-hover:scale-105 transition-transform duration-500 ease-in-out rounded-xl" src="{{post.image}}" alt="Image Description">
       
      </div>

      <div class="mt-7">
        <h2 class="text-2xl text-black group-hover:text-blue-600 ">
          {{post.title}}
        </h2>
        <p class="mt-5 text-gray group-hover:text-black ">
          {{post.excerpt}}
        </p>
        <p class="mt-5 inline-flex items-center gap-x-1.5 text-blue-600 decoration-2 group-hover:underline font-medium">
          Read more
          <svg class="w-2.5 h-2.5" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M5.27921 2L10.9257 7.64645C11.1209 7.84171 11.1209 8.15829 10.9257 8.35355L5.27921 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </p>
      </div>
    </a>

   
    {% else %}
   
    <!-- End Card -->

    <!-- Card -->
    <!-- End Card -->

    <!-- Card -->

    <a class="group relative flex flex-col w-full min-h-[15rem] bg-blue-100 bg-center bg-cover rounded-xl hover:shadow-lg transition bg-[url('../..{{post.image}}')]" href="{{post.url}}">
      <div class="flex-auto p-4 md:p-6">
        <h3 class="text-xl text-black group-hover:text-black"><span class="font-bold">{{post.title}}</span></h3>
        <h3 class="text-xl text-black group-hover:text-black mt-10"><span class="">{{post.excerpt}}</span></h3>
      </div>
      <div class="pt-0 p-4 md:p-6">
        <div class="inline-flex items-center gap-2 text-sm font-medium text-blue-600 group-hover:text-blue-600">
          Read more
          <svg class="w-2.5 h-2.5" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M5.27921 2L10.9257 7.64645C11.1209 7.84171 11.1209 8.15829 10.9257 8.35355L5.27921 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </a>
    {% endif %}
    {% endfor %}
    <!-- End Card -->
  </div>
  <!-- End Grid -->
</div>
<!-- End Card Blog -->
</main>
