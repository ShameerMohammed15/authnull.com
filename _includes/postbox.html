<!-- Card Blog -->

  <main class="">
   

<div class="max-w-[85rem] px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto">
  <!-- Grid -->

 
  <div class="grid sm:grid-cols-2 lg:grid-cols-3  ">
    <!-- Card -->
 

    {% for post in site.posts %}
   


    <div class="  py-2 mt-2 w-96 border-blue-800  style="z-index: 5;">
      <a href="{{post.url}}">
     <div class="bg-slate-100 py-2 mt-2"> <figure class="overflow-hidden" style="height:150px;"><img src="{{post.image}}" /></figure></div>
      <div class="">
        <h2 class="py-2 text-3xl font-bold text-black hover:underline">
          {{post.title}}
        </h2>
        <p>{{post.excerpt}}</p>
       
      </div>
    </a>
    </div>


  
    

   
    {% endfor %}
    <!-- End Card -->
  </div>
  <!-- End Grid -->
</div>
<!-- End Card Blog -->
</main>
