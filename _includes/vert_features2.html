    /* Typography */


/* lovely fluid fonts */
 

@media screen and (min-width: 1140px) {
  :root {
    --fluid-screen: calc(var(--fluid-max-width) * 1px);
  }
}
 
/* fluid paddings */
 
/* commonly used utils */

.pad-s {
  padding-top: var(--space-s);
  padding-bottom: var(--space-s);
}

.pad-m {
  padding-top: var(--space-m);
  padding-bottom: var(--space-m);
}

.pad-l {
  padding-top: var(--space-l);
  padding-bottom: var(--space-l);
}

.pad-xl {
  padding-top: var(--space-xl);
  padding-bottom: var(--space-xl);
}

.flow > * + * {
  margin-top: 1em;
}

.text-center {
  text-align: center;
}

.box {
  width: 75px;
  height: 75px;
  border-radius: 12px;

  align-items: center;
  justify-content: center;
  text-align: center;
  background-color: var(--green);
  font-weight: 600;
  color: var(--dark);

.center {

}

  background-color: var(--green);

  line-height: 1.45;
}

h1,
h2,
h3,
h4 {
  margin: 10px 0 10px 0;
  font-weight: 400;
  line-height: 1.2;
}

h1,
.h1 {
  font-size: var(--step-4);
}

h2,
.h2 {
  font-size: var(--step-3);
}

h3,
.h3 {
  font-size: var(--step-2);
}

h4,
.h4,
.lead {
  font-size: var(--step-1);
}

a {
  color: var(--green);
  font-weight: bold;
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}

.light a {
  color: var(--green-dark);
}


button {
  display: inline-block;
  outline: none;
  padding: 8px 14px;
  background: var(--dark);
  border: solid 2px var(--light);
  color: var(--light);
  text-decoration: none;
  border-radius: 99px;
  padding: 12px 25px;
  text-transform: uppercase;

  cursor: pointer;
  line-height: 18px;
}

.gsap-logo {
  width: 20vw;

  z-index: 9999;
}

.gsap-logo img {
  width: 100%;
}

.gsap-3-logo {
  width: 20vw;
  max-width: 150px;
  position: fixed;
  bottom: 15px;
  right: 15px;
}

/* panels  */

.panel {
  min-height: 100vh;
  padding-left: 0.6rem;
  padding-right: 0.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
}

.panel.gray {
  background-color: #777;
  background-image: var(--gradient-macha);
}
.panel.blue {
  background-color: #2c7ad2;
  background-image: var(--gradient-summer-fair);
}
.panel.orange {
  background-color: #e77614;
  background-image: var(--gradient-orange-crush);
}

.panel.red {
  background-color: #c82736;
  background-image: var(--gradient-lipstick);
}

.panel.purple {
  background-color: #8d3dae;
  background-image: var(--gradient-purple-haze);
}
.panel.green {
  background-color: #28a92b;
  background-image: var(--gradient-macha);
}

.panel.simple {
   background-image: none!important;
}

/* SCROLL DOWN */
.scroll-down {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translate(-50%, 0);
  font-weight: 400;
  text-transform: uppercase;
  font-size: 16px;
  overflow: visible;
}
.scroll-down .arrow {
  position: relative;
  top: -4px;
  margin: 0 auto;
  width: 20px;
  height: 20px;
  background-size: contain;
}

 

pre.prettyprint {
  max-width: 100%;
  overflow: auto;
}

ul pre.prettyprint {
  margin-left: -0.5rem;
}

/* prism */


.box.green, .gradient-green {
  background-color: rgb(236, 243, 251)
}

.box.green-lt, .gradient-green-2 {
    background-color: rgb(236, 243, 251)

}

.box.orange, .gradient-orange {
    background-color: rgb(238, 238, 238)

}

.box.purple, .gradient-purple {
    background-color: rgb(230, 221, 230);

}

.box.blue-lt .gradient-blue-2 {
    background-color: rgb(215, 214, 235);

}

.box.blue, .gradient-blue {
    background-color:  rgb(204, 204, 243)

}

.box.red, .gradient-red {
    background-color: rgb(249, 209, 209)

}

.gradient-blue-dark {
    background-color: darkblue;

}
