<!-- Card Blog -->
<main class="bg-blue-50">
    <div class="max-w-[85rem] px-4 py-10 sm:px-6 lg:px-8 lg:py-14 mx-auto">
        <!-- Grid -->
        <div class="grid lg:grid-cols-2 gap-y-12 gap-x-6">
          <!-- Card -->
          {% for collection in site.collections %}
          <a class="group sm:flex" href="{{collection.url}}">
        <script></script>
            <div class="flex-shrink-0 relative rounded-xl overflow-hidden w-full h-[200px] sm:w-[250px] sm:h-[350px]">
              <img class="w-full h-full absolute top-0 left-0 object-cover" src="../assets/images/fraud.jpeg" alt="Image Description">
            </div>
      
            <div class="flex flex-wrap">
              <div class="p-4 flex flex-col h-full sm:p-6">
                <div class="mb-3">
                  <p class="inline-flex items-center gap-1.5 py-1.5 px-3 rounded-md text-xs font-medium bg-gray-100 text-gray-800  ">
                    KloudOne
                  </p>
                </div>
                <h3 class="text-lg sm:text-2xl font-semibold text-gray-800 group-hover:text-blue-600  ">
                  Replacing keycloack with passwordless for a Financial services company
                </h3>
                <p class="mt-2 text-gray-600 ">
                  Authnull helped replace KeyCloack Identity management for a financial services 
                </p>
      
                <div class="mt-5 sm:mt-auto">
                  <!-- Avatar -->
                  <div class="flex items-center">
                    <div class="flex-shrink-0">
                      <img class="h-[2.875rem] w-[2.875rem] rounded-full" src="../assets/images/company.png" alt="Image Description">
                    </div>
                    <div class="ml-2.5 sm:ml-4">
                      <h4 class="font-semibold text-gray-800 ">
                        Asif Ali
                      </h4>
                      <p class="text-xs text-gray-500">
                        Feb 15, 2021
                      </p>
                    </div>
                  </div>
                  <!-- End Avatar -->
                </div>
              </div>
            </div>
          </a>
          <!-- End Card -->
      
          {% endfor %}
        </div>
        <!-- End Grid -->
      </div>
</main>

  <!-- End Card Blog -->
